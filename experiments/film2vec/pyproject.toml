[project]
name = "film2vec-experiments"
version = "0.0.0"
description = "Throwaway experiment pipeline for film2vec content features. Not library code."
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2.3",
    "scipy>=1.11",
    "torch>=2.4",
    "torchaudio>=2.4",
    "transformers>=4.53",
    "timm>=1.0",
    "huggingface_hub>=0.24",
    "transnetv2-pytorch==1.0.5",
    "mlx-whisper>=0.4.3",
    "scikit-learn>=1.9.1",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
